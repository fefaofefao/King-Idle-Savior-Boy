<!doctype html><html><head><style>
@font-face{font-family:F;src:url(../../node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2)}
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{background:radial-gradient(circle at 50% 120%,#ffb347 0,#e0632e 22%,#5a2a8a 55%,#1b2a4a 100%);font-family:F;position:relative}
.rays{position:absolute;left:50%;top:60%;width:1400px;height:1400px;margin:-700px;background:repeating-conic-gradient(rgba(255,255,255,.07) 0 8deg,transparent 8deg 24deg);border-radius:50%}

.knight{position:absolute;left:30px;bottom:20px;width:440px;filter:drop-shadow(0 10px 12px rgba(0,0,0,.5))}
.king{position:absolute;right:30px;bottom:30px;width:340px;image-rendering:pixelated;filter:drop-shadow(0 0 30px rgba(255,200,60,.8))}

</style></head><body><div class="rays"></div><div class="ground"></div>
